<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente da Lâmina Incandescente -->
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Gradiente das Chamas Exteriores -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="90%" stop-color="#fde047" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Borda Externa Estilizada (Estilo Dark Fantasy) -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#141118" stroke="#3d1d1a" stroke-width="2.5"/>
  <!-- Chanfro Metálico Interno Flamejante -->
  <rect x="5" y="5" width="54" height="54" rx="7" fill="#201115" stroke="#f97316" stroke-width="1.2" opacity="0.6"/>

  <!-- Brilho de Fundo do Fogo Primordial -->
  <circle cx="36" cy="28" r="22" fill="#ea580c" opacity="0.25"/>

  <!-- Labaredas de Fundo / Estouro Ígneo -->
  <path d="M24 38 Q22 26 34 20 Q38 10 46 8 Q44 20 54 22 Q46 32 40 40 Z" fill="url(#flameGrad)" opacity="0.5"/>
  <path d="M28 42 Q30 28 42 22 Q48 14 52 10 Q48 24 50 30 Q42 36 34 44 Z" fill="#ef4444" opacity="0.6"/>

  <!-- Pomo e Empunhadura da Espada (Diagonal Inferior Esquerda para Superior Direita) -->
  <!-- Pomo Dourado de Caveira/Esfera -->
  <circle cx="15" cy="49" r="3.5" fill="#f59e0b" stroke="#78350f" stroke-width="1.2"/>
  <circle cx="14" cy="48" r="1.2" fill="#fef3c7"/>
  <!-- Cabo com Enrolamento de Couro Rúnico -->
  <path d="M17 47 L24 40" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M17 47 L24 40" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Guarda-Mão Alado de Aço Forjado -->
  <path d="M17 37 Q25 43 31 35 L29 33 Q23 39 19 33 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="1.2"/>
  <path d="M19 33 L29 43" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lâmina Principal Incandescente -->
  <path d="M26 36 L48 14 L52 10 L50 16 L34 40 Z" fill="url(#bladeGrad)" stroke="#7c2d12" stroke-width="1"/>
  <!-- Fio de Corte Superior com Fogo Branco de Alta Temperatura -->
  <path d="M28 34 L52 10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Línguas de Fogo Ativas lambendo a Lâmina -->
  <path d="M30 32 Q34 24 40 26 Q44 18 50 16 Q44 24 42 28 Z" fill="#fde047"/>
  <path d="M36 28 Q40 22 46 22 Q44 26 40 30 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M24 38 Q28 34 32 36 Q30 38 26 40 Z" fill="#f97316"/>

  <!-- Faíscas e Fagulhas Flutuantes (Partículas de Brasa) -->
  <circle cx="48" cy="8" r="1.5" fill="#fef08a"/>
  <circle cx="56" cy="18" r="1.2" fill="#f97316"/>
  <circle cx="42" cy="14" r="1" fill="#fde047"/>
  <circle cx="34" cy="16" r="1.2" fill="#ef4444"/>
  <circle cx="20" cy="28" r="1" fill="#f59e0b"/>
  <circle cx="54" cy="30" r="0.8" fill="#fbbf24"/>
</svg>
