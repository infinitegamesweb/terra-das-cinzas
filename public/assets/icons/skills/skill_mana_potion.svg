<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente do Líquido Mágico de Mana -->
    <linearGradient id="manaLiquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Gradiente do Vidro Translúcido -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Borda Externa Estilizada (Estilo Dark Fantasy) -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#11131c" stroke="#252c48" stroke-width="2.5"/>
  <!-- Chanfro Metálico Interno Arcano -->
  <rect x="5" y="5" width="54" height="54" rx="7" fill="#151726" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>

  <!-- Brilho de Fundo Arcano / Aura de Éter -->
  <circle cx="32" cy="36" r="22" fill="#3b82f6" opacity="0.25"/>
  <circle cx="32" cy="36" r="14" fill="#38bdf8" opacity="0.2"/>

  <!-- Rolha de Madeira Encantada com Selo de Ouro -->
  <polygon points="28,11 36,11 35,16 29,16" fill="#b45309" stroke="#78350f" stroke-width="1"/>
  <!-- Bocal de Vidro da Garrafa com Aro Reforçado -->
  <ellipse cx="32" cy="17" rx="5" ry="2" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.2"/>
  <rect x="28" y="17" width="8" height="6" fill="#bfdbfe" opacity="0.7"/>

  <!-- Frasco Bojudo / Redoma de Vidro Alquímica -->
  <path d="M28 23 C28 27 16 33 16 43 C16 52 23 57 32 57 C41 57 48 52 48 43 C48 33 36 27 36 23 Z" 
        fill="url(#glassGrad)" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Líquido de Mana Arcana Concentrada (Preenchimento Interior) -->
  <path d="M19 43 C19 36 26 31 32 31 C38 31 45 36 45 43 C45 50 39 55 32 55 C25 55 19 50 19 43 Z" 
        fill="url(#manaLiquidGrad)"/>

  <!-- Superfície Curva e Ondulante da Mana -->
  <ellipse cx="32" cy="32" rx="10" ry="3" fill="#67e8f9" opacity="0.8"/>
  <ellipse cx="32" cy="32.5" rx="7" ry="1.8" fill="#e0f2fe"/>

  <!-- Bolhas Arcanas de Energia Flutuando no Elixir -->
  <circle cx="28" cy="46" r="2" fill="#a5f3fc" opacity="0.85"/>
  <circle cx="27" cy="45.5" r="0.6" fill="#ffffff"/>
  <circle cx="36" cy="42" r="1.5" fill="#a5f3fc" opacity="0.75"/>
  <circle cx="31" cy="49" r="1.2" fill="#7dd3fc" opacity="0.65"/>
  <circle cx="39" cy="48" r="1.8" fill="#38bdf8" opacity="0.7"/>

  <!-- Reflexo Especular Curvo do Vidro (Highlight Lateral Alto Padrão) -->
  <path d="M20 38 C18 43 20 49 23 52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M22 35 C21 38 22 41 23 43" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Partículas Arcanas e Estrelas de Mana Subindo -->
  <!-- Estrela Mágica Superior Direita -->
  <polygon points="46,14 47.5,17.5 51,19 47.5,20.5 46,24 44.5,20.5 41,19 44.5,17.5" fill="#e0f2fe"/>
  <!-- Pequenas Centelhas de Éter -->
  <circle cx="16" cy="22" r="1.2" fill="#38bdf8"/>
  <circle cx="48" cy="28" r="1" fill="#93c5fd"/>
  <circle cx="22" cy="14" r="0.8" fill="#bae6fd"/>
  <circle cx="49" cy="36" r="1.2" fill="#67e8f9"/>
</svg>
