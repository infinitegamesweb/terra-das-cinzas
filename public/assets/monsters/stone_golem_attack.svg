<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sombra no Chão (Alargada indicando impacto iminente) -->
  <ellipse cx="32" cy="56" rx="23" ry="7" fill="#000000" opacity="0.45"/>

  <!-- Onda de Choque no Solo (Preparação do Slam) -->
  <path d="M12 55 Q32 50 52 55" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 3" fill="none" opacity="0.7"/>

  <!-- Pés e Pernas em Posição de Impulso -->
  <path d="M18 47 L24 47 L25 55 L16 55 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M40 47 L46 47 L48 55 L39 55 Z" fill="#334155" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Tronco de Rocha Inclinado para Frente -->
  <path d="M21 27 L43 27 L46 48 L18 48 Z" fill="#475569" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M19 43 L45 43 L44 48 L20 48 Z" fill="#334155"/>

  <!-- Núcleo de Cristal Sobrecarregado (Glow Radiante) -->
  <circle cx="32" cy="37" r="9" fill="#c084fc" opacity="0.25"/>
  <polygon points="32,29 39,37 32,45 25,37" fill="#c084fc" stroke="#f3e8ff" stroke-width="1.5"/>
  <polygon points="32,32 36,37 32,42 28,37" fill="#ffffff"/>
  <!-- Raios de Ruptura de Energia Arcana/Cinzas -->
  <line x1="20" y1="37" x2="13" y2="35" stroke="#e879f9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="37" x2="51" y2="35" stroke="#e879f9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="45" x2="32" y2="52" stroke="#e879f9" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cabeça Inclinada Focando o Alvo -->
  <polygon points="26,16 38,16 41,27 23,27" fill="#64748b" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Olhos Incandescentes de Fúria -->
  <polygon points="26,19 30,19 29,22 25,22" fill="#ff0055"/>
  <polygon points="34,19 38,19 39,22 35,22" fill="#ff0055"/>
  <circle cx="28" cy="20.5" r="1.2" fill="#ffffff"/>
  <circle cx="36" cy="20.5" r="1.2" fill="#ffffff"/>

  <!-- Braços Ergueram os Punhos Gigantes ao Alto (Pose de Ataque Slam) -->
  <!-- Braço Esquerdo -->
  <path d="M16 27 L11 16 L17 14 L21 25 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="7" y="5" width="13" height="13" rx="3.5" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
  <path d="M9 7 L16 7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Espinhos e Musgo no Punho -->
  <polygon points="10,5 12,1 15,5" fill="#334155"/>
  <circle cx="15" cy="13" r="2.5" fill="#4d7836"/>

  <!-- Braço Direito -->
  <path d="M48 27 L53 16 L47 14 L43 25 Z" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="44" y="5" width="13" height="13" rx="3.5" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
  <path d="M47 7 L54 7" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Espinhos e Musgo no Punho -->
  <polygon points="49,5 52,1 55,5" fill="#334155"/>
  <circle cx="49" cy="13" r="2.5" fill="#4d7836"/>
</svg>
